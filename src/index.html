<!DOCTYPE html>
<html lang="en" data-tauri-drag-region>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAKH</title>
    <link rel="icon" type="image/png" href="appicon/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-tauri-drag-region>
    <div id="app" class="is-paused" data-tauri-drag-region>
      <!-- Close Button -->
      <button id="close-btn" class="icon-btn close">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Waveform Center -->
      <div class="waveform" data-tauri-drag-region>
        <div class="bar" data-tauri-drag-region></div>
        <div class="bar" data-tauri-drag-region></div>
        <div class="bar" data-tauri-drag-region></div>
        <div class="bar" data-tauri-drag-region></div>
        <div class="bar" data-tauri-drag-region></div>
      </div>

      <!-- Status Text -->
      <div id="status-text" data-tauri-drag-region>PAUSED</div>

      <!-- Dashboard/Settings Button -->
      <button id="dashboard-btn" class="icon-btn dashboard">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path d="M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.15-.08a2 2 0 00-2.73.73l-.22.38a2 2 0 00.73 2.73l.15.1a2 2 0 011 1.72v.51a2 2 0 01-1 1.74l-.15.09a2 2 0 00-.73 2.73l.22.38a2 2 0 002.73.73l.15-.08a2 2 0 012 0l.43.25a2 2 0 011 1.73V20a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.15.08a2 2 0 002.73-.73l.22-.39a2 2 0 00-.73-2.73l-.15-.08a2 2 0 01-1-1.74v-.5a2 2 0 011-1.74l.15-.1a2 2 0 00.73-2.73l-.22-.38a2 2 0 00-2.73-.73l-.15.08a2 2 0 01-2 0l-.43-.25a2 2 0 01-1-1.73V4a2 2 0 00-2-2z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="3" stroke="currentColor" fill="none" stroke-width="2"/>
        </svg>
      </button>

      <!-- Toggle Button -->
      <button id="toggle-btn" class="icon-btn toggle">
        <!-- Play Icon (Default) -->
        <svg id="play-icon" viewBox="0 0 24 24" width="14" height="14">
          <path d="M5 3l14 9-14 9V3z" stroke="currentColor" fill="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        </svg>
        <!-- Stop Icon (Hidden initially) -->
        <svg id="stop-icon" viewBox="0 0 24 24" width="14" height="14" style="display: none;">
          <rect x="6" y="6" width="12" height="12" stroke="currentColor" fill="currentColor" stroke-width="2.5"/>
        </svg>
      </button>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
